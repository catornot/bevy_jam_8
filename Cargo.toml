[package]
name = "bevy_jam_8"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR CC0-1.0"

[dependencies]
avian3d = "0.8.0"
bevy-inspector-egui = { version = "0.38.0", default-features = false, features = [ "3d", "bevy", "bevy_camera", "bevy_core_pipeline", "bevy_gizmos", "bevy_image", "bevy_light", "bevy_mesh", "bevy_mikktspace", "bevy_pbr", "bevy_render" ] }
bevy_ahoy = { git = "https://github.com/catornot/bevy_ahoy.git", branch = "0.20", version = "0.2.0" }
bevy_asset_loader = "0.28.1"
bevy_enhanced_input = "0.27.2"
rand = "0.10.3"

[profile.dev]
opt-level = 0

[dependencies.bevy]
version = "0.20.1"
features = []

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.web-dev.package]
debug = false

[profile.web-dev.package."*"]
opt-level = 3

[profile.web-release]
inherits = "release"
opt-level = "s"


[features]
default = ["dev"]
dev = ["bevy/dynamic_linking", "bevy/track_location", "bevy/dev"]

[package.metadata.bevy_cli.web]
default-features = false

[package.metadata.bevy_cli.web.dev]
wasm-opt = false

[package.metadata.bevy_cli.web.web-dev]
wasm-opt = false
